<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        #submitButton {
            background: #333;
            color: white;
        }

        #resetButton {
            background: #777;
            color: white;
        }

        #clearStudentsButton {
            background: #b00020;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .summary-box {
            background: #f1f1f1;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .summary-box h3 {
            margin: 0 0 10px;
        }

        .summary-box p {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        .edit-btn {
            background: #555;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #b00020;
            color: white;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Manager</h1>

    <!-- Student Form -->
    <div class="card">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="className">Class</label>
                    <input
                        type="text"
                        id="className"
                        placeholder="e.g. ND2"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        placeholder="e.g. Mathematics"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="score">Score</label>
                    <input
                        type="number"
                        id="score"
                        min="0"
                        max="100"
                        placeholder="Enter score"
                        required
                    >
                </div>

            </div>

            <div class="buttons">

                <button type="submit" id="submitButton">
                    Add Student
                </button>

                <button type="button" id="resetButton">
                    Reset
                </button>

                <button type="button" id="clearStudentsButton">
                    Clear All Students
                </button>

            </div>

            <p id="message"></p>

        </form>

    </div>


    <!-- Summary -->
    <div class="card">

        <h2>Summary</h2>

        <div class="summary">

            <div class="summary-box">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="summary-box">
                <h3>Average Score</h3>
                <p id="averageScore">0</p>
            </div>

            <div class="summary-box">
                <h3>Highest Score</h3>
                <p id="highestScore">0</p>
            </div>

            <div class="summary-box">
                <h3>Passed</h3>
                <p id="passedStudents">0</p>
            </div>

        </div>

    </div>


    <!-- Students Table -->
    <div class="card">

        <h2>Student Records</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Subject</th>
                        <th>Score</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="students-manager.js"></script>

</body>
</html>
